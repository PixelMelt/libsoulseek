[package]
name = "soulseek"
version = "0.3.0"
edition = "2024"
license = "GPL-3.0-or-later"

[dependencies]
flate2 = "1"
libc = "0.2"
lofty = "0.24.0"
md5 = "0.7"
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
socket2 = { version = "0.6", features = ["all"] }
thiserror = "2"
tokio = { version = "1.52.3", features = ["rt", "net", "io-util", "time", "sync", "macros", "fs"] }
tracing = "0.1.44"

[dev-dependencies]
tokio = { version = "1.52.3", features = ["test-util"] }
